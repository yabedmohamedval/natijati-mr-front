<header class="site-header">
  <div class="header-inner">
    <a routerLink="/" class="brand" [attr.aria-label]="'Natijati MR — ' + i18n.t('nav.home')">
      <span class="brand-mark" aria-hidden="true">ن</span>
      <span class="brand-copy">
        <span class="brand-name" dir="ltr">Natijati <span>MR</span></span>
        <span class="brand-subtitle">{{ i18n.t('brand.subtitle') }}</span>
      </span>
    </a>

    <nav class="desktop-navigation" [attr.aria-label]="i18n.t('a11y.navigation')">
      @for (item of navigation; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }" class="nav-link">{{ i18n.t(item.label) }}</a>
      }
    </nav>

    <div class="header-actions">
      <button mat-stroked-button type="button" class="language-button" (click)="i18n.toggleLanguage()"
        [attr.aria-label]="i18n.isArabic() ? i18n.t('language.fr') : i18n.t('language.ar')"
        [attr.lang]="i18n.isArabic() ? 'fr' : 'ar'">
        <mat-icon>language</mat-icon>
        <span>{{ i18n.isArabic() ? i18n.t('language.fr') : i18n.t('language.ar') }}</span>
      </button>
      <button mat-icon-button type="button" class="mobile-menu-button" [matMenuTriggerFor]="mobileMenu"
        [attr.aria-label]="i18n.t('nav.openMenu')"><mat-icon>menu</mat-icon></button>
    </div>
  </div>
</header>

<mat-menu #mobileMenu="matMenu" class="mobile-navigation-menu" xPosition="before">
  @for (item of navigation; track item.path) {
    <a mat-menu-item [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: item.path === '/' }">
      <mat-icon>{{ item.icon }}</mat-icon><span>{{ i18n.t(item.label) }}</span>
    </a>
  }
</mat-menu>
